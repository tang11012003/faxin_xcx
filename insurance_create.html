<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>去投保</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #F8F9FA;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      color: #202536;
    }
    .phone-container {
      width: 375px;
      min-height: 100vh;
      background: #F8F9FA;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      padding-bottom: 40px;
    }

    /* 顶部导航栏 (1:1 还原真机小程序截图) */
    .nav-bar {
      height: 48px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #F0F1F5;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .nav-back {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
    }
    .nav-back svg {
      width: 20px;
      height: 20px;
      stroke: #202536;
    }
    .nav-title {
      font-size: 17px;
      font-weight: 600;
      color: #202536;
    }
    .capsule-menu {
      width: 86px;
      height: 32px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px;
      background: rgba(255, 255, 255, 0.85);
    }
    .capsule-dots {
      display: flex;
      gap: 3px;
    }
    .capsule-dots span {
      width: 3.5px;
      height: 3.5px;
      background: #000;
      border-radius: 50%;
    }
    .capsule-divider {
      width: 1px;
      height: 14px;
      background: rgba(0, 0, 0, 0.1);
    }
    .capsule-circle {
      width: 15px;
      height: 15px;
      border: 1.8px solid #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .capsule-circle-inner {
      width: 5px;
      height: 5px;
      background: #000;
      border-radius: 50%;
    }

    /* 表单内容区域 (1:1 像素级复刻图3与真机原型：已彻底去除项目名称) */
    .form-container {
      display: flex;
      flex-direction: column;
    }

    .form-section-card {
      background: #FFFFFF;
      padding: 16px 16px 14px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .form-section-card:active {
      background: #FAFAFC;
    }

    .section-divider {
      height: 1px;
      background: #F2F3F7;
      margin: 0 16px;
    }

    .field-label {
      font-size: 15px;
      font-weight: 600;
      color: #202536;
      line-height: 22px;
    }
    .field-input-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .selector-text {
      font-size: 14px;
      color: #9497B1;
      display: flex;
      align-items: center;
    }
    .selector-text.has-value {
      color: #202536;
      font-weight: 500;
    }
    .required-star {
      color: #FF4D4F;
      margin-right: 4px;
      font-size: 14px;
    }
    .chevron-right {
      width: 16px;
      height: 16px;
      stroke: #C2C5D6;
      stroke-width: 2;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* 底部操作主按钮 (1:1 还原真机原型：确定) */
    .btn-submit-wrap {
      padding: 28px 16px 20px 16px;
    }
    .btn-submit {
      width: 100%;
      height: 48px;
      background: #00D679;
      border: none;
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 214, 121, 0.28);
      transition: all 0.15s ease;
    }
    .btn-submit:active {
      transform: scale(0.98);
      background: #00BF6C;
    }

    /* 半屏选择抽屉遮罩 (居中适配 375px 手机视口) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .drawer-sheet {
      width: 375px;
      max-width: 100%;
      background: #FFFFFF;
      border-radius: 16px 16px 0 0;
      padding: 20px 16px 24px 16px;
      box-sizing: border-box;
      animation: sheetUp 0.22s ease-out;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .drawer-title {
      font-size: 16px;
      font-weight: 600;
      color: #202536;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .drawer-list {
      overflow-y: auto;
      max-height: 50vh;
      margin-bottom: 20px;
    }
    .drawer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 4px;
      border-bottom: 1px solid #F2F3F5;
      cursor: pointer;
    }
    .drawer-item:last-child {
      border-bottom: none;
    }
    .drawer-item-text {
      font-size: 15px;
      color: #262626;
      font-weight: 500;
    }
    /* 单选圆形控件 (绿色对钩圆圈，1:1复刻图1与图2) */
    .radio-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #D9D9D9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .drawer-item.selected .radio-circle {
      border-color: #00D679;
      background: #00D679;
    }
    .radio-inner-check {
      display: none;
      width: 12px;
      height: 12px;
    }
    .drawer-item.selected .radio-inner-check {
      display: block;
    }

    /* 抽屉底部双按钮: [取消] [确定] (1:1 还原用户截图) */
    .drawer-actions {
      display: flex;
      gap: 12px;
    }
    .drawer-btn {
      flex: 1;
      height: 44px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
    }
    .drawer-btn-cancel {
      background: #F4F4F7;
      color: #565868;
    }
    .drawer-btn-confirm {
      background: #00D679;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(0, 214, 121, 0.25);
    }
    .drawer-btn:active {
      opacity: 0.88;
    }

    /* 内联拦截反馈弹窗 (前置依赖拦截：未选保险商品禁止选企业，严禁原生 alert) */
    .feedback-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 120;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .feedback-card {
      width: 310px;
      background: #FFFFFF;
      border-radius: 14px;
      padding: 24px 20px 20px 20px;
      text-align: center;
      box-sizing: border-box;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      animation: popIn 0.2s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .feedback-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #E8F7ED;
      color: #009944;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
    }
    .feedback-icon.warning-icon {
      background: #FFF7E6;
      color: #FA8C16;
    }
    .feedback-title {
      font-size: 16px;
      font-weight: 700;
      color: #202536;
      margin-bottom: 8px;
    }
    .feedback-desc {
      font-size: 13.5px;
      color: #6B7280;
      line-height: 20px;
      margin-bottom: 20px;
    }
    .feedback-btn {
      width: 100%;
      height: 42px;
      background: #00D679;
      border: none;
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feedback-btn:active {
      background: #00BF6C;
    }
  </style>

<style id="protoMobileAnnotationCss">
:root {
  --protoMobile-accent: #3388ff;
  --protoMobile-accent-dark: #2167d9;
  --protoMobile-accent-soft: #f0f9ff;
  --protoMobile-ink: #223355;
  --protoMobile-muted: #6b7a99;
  --protoMobile-line: #dde1eb;
  --protoMobile-bg: #edf0f6;
  --protoMobile-device-width: 414px;
  --protoMobile-docs-width: 520px;
}

html.protoMobile-ready,
html.protoMobile-ready body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

.protoMobile-stage,
.protoMobile-stage *,
.protoMobile-overlay-root,
.protoMobile-overlay-root * {
  box-sizing: border-box;
  letter-spacing: 0;
}

.protoMobile-stage {
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  width: 100vw;
  max-width: none;
  height: 100dvh;
  padding: 16px;
  display: grid;
  grid-template-columns: var(--protoMobile-docs-width) 8px var(--protoMobile-device-width) minmax(320px, 1fr);
  gap: 16px;
  align-items: center;
  overflow: hidden;
  background: var(--protoMobile-bg);
  color: var(--protoMobile-ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
}

.protoMobile-stage.no-docs {
  grid-template-columns: var(--protoMobile-device-width) minmax(320px, 1fr);
  justify-content: center;
}
.protoMobile-stage.no-docs .protoMobile-desktop-splitter { display: none; }
.protoMobile-stage.no-docs .protoMobile-device { grid-column: 1; }
.protoMobile-stage.no-docs .protoMobile-notes-panel { grid-column: 2; }

.protoMobile-docs-panel { grid-column: 1; grid-row: 1; }
.protoMobile-desktop-splitter { grid-column: 2; grid-row: 1; }
.protoMobile-device { grid-column: 3; grid-row: 1; }
.protoMobile-notes-panel { grid-column: 4; grid-row: 1; }

.protoMobile-desktop-splitter {
  position: relative;
  width: 8px;
  min-width: 8px;
  height: min(896px, calc(100dvh - 32px));
  align-self: center;
  cursor: col-resize;
  touch-action: none;
  outline: none;
}

.protoMobile-desktop-splitter::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 3px;
  height: 56px;
  border-radius: 2px;
  background: #b8c2d3;
  transform: translate(-50%, -50%);
  transition: height 0.15s ease, background 0.15s ease;
}

.protoMobile-desktop-splitter:hover::after,
.protoMobile-desktop-splitter:focus-visible::after,
.protoMobile-desktop-splitter.is-dragging::after { height: 84px; background: var(--protoMobile-accent); }
.protoMobile-stage.is-resizing { cursor: col-resize; user-select: none; }

.protoMobile-device,
.protoMobile-review-panel {
  height: min(896px, calc(100dvh - 32px));
  min-height: 0;
}

.protoMobile-device {
  position: relative;
  width: var(--protoMobile-device-width);
  min-width: 0;
  justify-self: center;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 12px 32px rgba(34, 51, 85, 0.12);
}

.protoMobile-device > [data-proto-app] {
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  margin: 0 !important;
}

.protoMobile-review-panel {
  min-width: 0;
  overflow: hidden;
  border: 1px solid rgba(51, 136, 255, 0.22);
  border-top: 3px solid rgba(51, 136, 255, 0.82);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 18px 44px rgba(34, 51, 85, 0.1);
}

.protoMobile-panel-header {
  height: 56px;
  padding: 0 16px;
  border-bottom: 1px solid #e9edf5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: #fff;
  font-size: 16px;
}

.protoMobile-doc-layout {
  height: calc(100% - 56px);

}

.protoMobile-doc-nav {
  padding: 12px 8px;

.protoMobile-doc-nav button:hover,

.protoMobile-doc-content {
  min-width: 0;
  padding: 0 16px 24px;
  overflow: auto;
  scroll-behavior: smooth;
}

.protoMobile-doc-section {
  padding: 20px 0;
  border-bottom: 1px solid #e9edf5;
  scroll-margin-top: 12px;
}

.protoMobile-doc-section:last-child { border-bottom: 0; }
.protoMobile-doc-section > h3 { margin: 0 0 12px; color: var(--protoMobile-ink); font-size: 16px; line-height: 24px; }

.protoMobile-desktop-toggle-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--protoMobile-muted);
  font-size: 12px;
  font-weight: 400;
  white-space: nowrap;
}

.protoMobile-switch {
  position: relative;
  width: 40px;
  height: 24px;
  min-height: 0;
  flex: 0 0 auto;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: #ced4e0;
  cursor: pointer;
}

.protoMobile-switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;

  border-radius: 50%;
  background: #fff;

  transition: transform 180ms ease;
}
.protoMobile-switch[aria-checked="true"] {
  background: #2563eb !important;
}

.protoMobile-switch[aria-checked="true"]::after {
  transform: translateX(16px) !important;
}


.protoMobile-notes-panel {
  display: flex !important;
  flex-direction: column !important;
}

.protoMobile-note-list {
  flex: 1;

  height: auto;
  padding: 12px;
  padding-bottom: 60px;
  overflow-y: auto;
  overflow-x: hidden;
  box-sizing: border-box;
}

.protoMobile-note-card {
  width: 100%;
  margin: 0 0 10px;
  padding: 12px 14px 12px 62px;

  border: 1px solid #e1e6ef;

  background: #fff;

  color: var(--protoMobile-ink);
  text-align: left;
  font: inherit;

}

.protoMobile-note-card:hover,
.protoMobile-note-card.is-active {
  border-color: #9bbcff;

  box-shadow: 0 8px 20px rgba(33, 103, 217, 0.13);
}

.protoMobile-note-index {

  place-items: center;
  background: var(--protoMobile-accent);

.protoMobile-note-header {

.protoMobile-note-tag {

  font-size: 11px;

  white-space: nowrap;

.protoMobile-note-tag.tag-add {
  background: #ecfdf5;

}

.protoMobile-note-tag.tag-modify {

.protoMobile-note-card.card-add { border-left-color: #10b981; }

      console.warn(`移动端标注 ${note.id || note.title || "未命名"} 的 target 无效`, error);

  function resolveNotesForContext(context) {
    return notesForScope(context.scope);

    function getClippedTargetRect(target) {
    if (!isVisible(target)) return null;
    const original = target.getBoundingClientRect();
    const deviceRect = device.getBoundingClientRect();
    let left = Math.max(original.left, deviceRect.left);
    let top = Math.max(original.top, deviceRect.top);
    let right = Math.min(original.right, deviceRect.right);
    let bottom = Math.min(original.bottom, deviceRect.bottom);
    let parent = target.parentElement;
    while (parent && parent !== appRoot.parentElement) {
      const style = getComputedStyle(parent);
      if (/(auto|scroll|hidden|clip)/.test(`${style.overflow}${style.overflowX}${style.overflowY}`)) {
        const rect = parent.getBoundingClientRect();
        left = Math.max(left, rect.left);
        top = Math.max(top, rect.top);
        right = Math.min(right, rect.right);
        bottom = Math.min(bottom, rect.bottom);
      }
      if (parent === appRoot) break;
      parent = parent.parentElement;
    }
    if (right <= left || bottom <= top) return null;
    return { original, visible: { left, top, right, bottom } };
  }

  function setActive(noteId) {
    activeNoteId = noteId;
    document.querySelectorAll(".protoMobile-marker, .protoMobile-note-card").forEach(element => {
      element.classList.toggle("is-active", element.dataset.noteId === noteId);
    });
  }

  function scheduleMarkerLayout() {
    if (layoutFrame) return;
    layoutFrame = requestAnimationFrame(() => {
      layoutFrame = 0;
      positionMarkers();
    });
  }

  function positionMarkers() {
    const deviceRect = device.getBoundingClientRect();
    const occupied = [];
    markerLayer.querySelectorAll(".protoMobile-marker").forEach(marker => {
      const note = currentNotes.find(item => item.id === marker.dataset.noteId);
      const target = note ? findTarget(note) : null;
      const clipped = target ? getClippedTargetRect(target) : null;
      if (!note || !clipped) {
        marker.hidden = true;
        return;
      }
      const anchorX = Number.isFinite(Number(note.x)) ? Math.min(1, Math.max(0, Number(note.x))) : 0.5;
      const anchorY = Number.isFinite(Number(note.y)) ? Math.min(1, Math.max(0, Number(note.y))) : 0.5;
      let left = clipped.original.left + clipped.original.width * anchorX;
      let top = clipped.original.top + clipped.original.height * anchorY;
      left = Math.max(clipped.visible.left, Math.min(clipped.visible.right, left));
      top = Math.max(clipped.visible.top, Math.min(clipped.visible.bottom, top));
      left = Math.max(deviceRect.left + 18, Math.min(deviceRect.right - 18, left));
      top = Math.max(deviceRect.top + 18, Math.min(deviceRect.bottom - 18, top));
      for (let attempt = 0; attempt < 5; attempt += 1) {
        if (!occupied.some(point => Math.hypot(point.left - left, point.top - top) < 36)) break;
        top = Math.min(deviceRect.bottom - 18, top + 36);
      }
      occupied.push({ left, top });
      marker.hidden = false;
      marker.style.left = `${left}px`;
      marker.style.top = `${top}px`;
    });
  }

  function renderMarkers() {

  async function renderMermaidBlocks(root) {

  function getNoteType(note) {

  function renderFilterBar() {

    const filterDefs = [
      { key: "all", label: "全部", count: counts.all, chipClass: "chip-all" },

  function highlightTarget(target) {
    document.querySelectorAll(".protoMobile-target-highlight").forEach(element => element.classList.remove("protoMobile-target-highlight"));
    target.classList.add("protoMobile-target-highlight");
    window.setTimeout(() => target.classList.remove("protoMobile-target-highlight"), 1100);

  function matchesApprovedScrollContainer(element) {
    return approvedScrollSelectors.some(selector => {
      try {
        return element.matches(selector);
      } catch (error) {
        console.warn(`移动端标注滚动容器选择器无效：${selector}`, error);
        return false;
      }
    });
  }

  function findScrollParent(target) {
    let parent = target.parentElement;
    while (parent && parent !== document.body && parent !== device && parent !== stage) {
      const style = getComputedStyle(parent);
      if ((matchesApprovedScrollContainer(parent) || parent === appRoot || parent.id === "app" || /(auto|scroll)/.test(style.overflowY))
        && /(auto|scroll)/.test(style.overflowY)
        && parent.scrollHeight > parent.clientHeight + 1) return parent;
      if (parent === appRoot) break;
      parent = parent.parentElement;
    }
    return null;
  }

  function isFullyVisibleInDevice(target, scroller = null) {
    const targetRect = target.getBoundingClientRect();
    const deviceRect = device.getBoundingClientRect();
    const scrollRect = scroller ? scroller.getBoundingClientRect() : deviceRect;
    const viewport = {
      left: Math.max(deviceRect.left, scrollRect.left),
      top: Math.max(deviceRect.top, scrollRect.top),
      right: Math.min(deviceRect.right, scrollRect.right),
      bottom: Math.min(deviceRect.bottom, scrollRect.bottom)
    };
    return targetRect.left >= viewport.left - 1
      && targetRect.top >= viewport.top - 1
      && targetRect.right <= viewport.right + 1
      && targetRect.bottom <= viewport.bottom + 1;
  }

  function trackScrollUntilSettled(scroller, target) {
    let last = scroller.scrollTop;
    let stableFrames = 0;
    let frameCount = 0;
    function track() {
      scheduleMarkerLayout();
      const current = scroller.scrollTop;
      stableFrames = Math.abs(current - last) < 0.5 ? stableFrames + 1 : 0;
      last = current;
      frameCount += 1;
      if (stableFrames >= 3 || frameCount > 90) {
        highlightTarget(target);
        scheduleMarkerLayout();
        return;
      }
      requestAnimationFrame(track);
    }
    requestAnimationFrame(track);
  }

    function tryOpenOverlayForNote(note) {

    const findTargetFn = typeof findNoteTarget === "function" ? findNoteTarget : (typeof findTarget === "function" ? findTarget : null);
    const existing = findTargetFn ? findTargetFn(note) : (root ? root.querySelector(targetSelector) : null);
    const isRenderableFn = typeof isRenderable === "function" ? isRenderable : (typeof isTargetRenderable === "function" ? isTargetRenderable : null);
    const isOverlayOpenFn = typeof isOverlayContainerOpen === "function" ? isOverlayContainerOpen : () => true;

    if (existing && (!isRenderableFn || isRenderableFn(existing)) && isOverlayOpenFn(existing)) {

    // 2. 编辑日程弹窗

    if (isEdit) {

    const keywords = title.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, " ").trim().split(/\s+/).filter(w => w.length >= 2 && !stopWords.has(w));

      if (btn) {

  function doLocateTarget(note, target) {
    setActive(note.id);
    if (note.scroll === false || target.closest('[data-proto-scroll="none"]')) {
      highlightTarget(target);
      scheduleMarkerLayout();
      return;
    }
    const scroller = findScrollParent(target);
    if (!scroller || isFullyVisibleInDevice(target, scroller)) {
      highlightTarget(target);
      scheduleMarkerLayout();
      return;
    }
    const scrollRect = scroller.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();
    const targetTop = targetRect.top - scrollRect.top + scroller.scrollTop;
    const maxScrollTop = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
    const desiredTop = Math.min(maxScrollTop, Math.max(0, targetTop - (scroller.clientHeight - targetRect.height) / 2));
    if (Math.abs(desiredTop - scroller.scrollTop) < 0.5) {
      highlightTarget(target);
      scheduleMarkerLayout();
      return;
    }
    scroller.scrollTo({ top: desiredTop, behavior: "smooth" });
    trackScrollUntilSettled(scroller, target);
  }

  function locateTarget(note) {
    let target = findTarget(note);
    const isOverlayOpenFn = typeof isOverlayContainerOpen === "function" ? isOverlayContainerOpen : () => true;
    if (!target || !isTargetRenderable(target) || !isOverlayOpenFn(target)) {
      if (tryOpenOverlayForNote(note)) {
        setTimeout(() => {
          syncContext();
          renderMarkers();
          const nextTarget = findTarget(note);
          if (nextTarget && isTargetRenderable(nextTarget)) {
            doLocateTarget(note, nextTarget);
          }
        }, 150);
        return;
      }
    }
    if (!target) return;
    doLocateTarget(note, target);
  }

        card.focus({ preventScroll: true });

    mobileSheetTitle.textContent = note.title;
    await renderRichContent(mobileSheetBody, note);
    mobileNoteLayer.classList.add("is-open");
    mobileNoteLayer.setAttribute("aria-hidden", "false");

      mobileDocsOpen.hidden = true;
      docsPanel.hidden = true;
      return;
    }
    for (const [index, section] of globalSections.entries()) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = section.title;
      button.classList.toggle("is-active", index === 0);
      const sectionNode = document.createElement("section");
      sectionNode.className = "protoMobile-doc-section";
      sectionNode.id = `protoMobile-doc-${section.id}`;
      const heading = document.createElement("h3");
      heading.textContent = section.title;
      const body = document.createElement("div");
      body.className = "protoMobile-rich-content";
      sectionNode.append(heading, body);
      docNav.appendChild(button);
      docContent.appendChild(sectionNode);
      await renderRichContent(body, section);
      button.addEventListener("click", () => {
        docNav.querySelectorAll("button").forEach(item => item.classList.toggle("is-active", item === button));
        const contentRect = docContent.getBoundingClientRect();
        const targetRect = sectionNode.getBoundingClientRect();
        docContent.scrollTo({ top: targetRect.top - contentRect.top + docContent.scrollTop, behavior: "smooth" });
      });
    }
  }

  function openMobileDocs() {
    if (!globalSections.length) return;
    closeMobileMenu();
    closeMobileNote();
    mobileDocsContent.innerHTML = docContent.innerHTML;
    mobileDocsContent.querySelectorAll("[id]").forEach(element => element.removeAttribute("id"));
    mobileDocsLayer.classList.add("is-open");
    mobileDocsLayer.setAttribute("aria-hidden", "false");
    markerLayer.classList.add("is-hidden");
  }

  function closeMobileDocs() {
    mobileDocsLayer.classList.remove("is-open");
    mobileDocsLayer.setAttribute("aria-hidden", "true");
    renderMarkers();
  }

  function syncContext() {
    ensureOverlayLayer(true);
    const context = getScopeContext();
    const nextNotes = notesForScope(context.scope);
    const scopeChanged = context.scope !== currentScope;
    const notesChanged = nextNotes.length !== currentNotes.length
      || nextNotes.some((note, index) => note.id !== currentNotes[index]?.id);
    if (scopeChanged || notesChanged) {
      currentScope = context.scope;
      currentNotes = nextNotes;
      if (!currentNotes.some(note => note.id === activeNoteId)) activeNoteId = "";
      closeMobileNote();
      renderNoteList();
      renderMarkers();
    } else {
      setActive(activeNoteId);
      scheduleMarkerLayout();
    }
    mobileCount.textContent = String(currentNotes.length);
    mobileMenuMeta.textContent = `当前页面 ${currentNotes.length} 条`;
    scheduleLayerAudit();
  }

  function runContextRefresh() {
    contextRefreshFrame = 0;
    syncContext();
    if (performance.now() < contextRefreshUntil) {
      contextRefreshFrame = requestAnimationFrame(runContextRefresh);
    }
  }

  function scheduleContextRefresh(settle = false) {
    if (settle === true) {
      contextRefreshUntil = Math.max(contextRefreshUntil, performance.now() + 900);
    }
    if (!contextRefreshFrame) contextRefreshFrame = requestAnimationFrame(runContextRefresh);
  }

  function positionMobileMenu() {
    if (!mobileMenu.classList.contains("is-open")) return;
    const launcherRect = mobileLauncher.getBoundingClientRect();
    const menuRect = mobileMenu.getBoundingClientRect();
    const margin = 8;
    const left = Math.min(Math.max(margin, launcherRect.right - menuRect.width), window.innerWidth - menuRect.width - margin);
    let top = launcherRect.top - menuRect.height - 10;
    if (top < margin) top = launcherRect.bottom + 10;
    mobileMenu.style.left = `${left}px`;
    mobileMenu.style.top = `${Math.min(top, window.innerHeight - menuRect.height - margin)}px`;
  }

  function closeMobileMenu() {
    mobileMenu.classList.remove("is-open");
    mobileLauncher.setAttribute("aria-expanded", "false");
  }

  function toggleMobileMenu() {
    const willOpen = !mobileMenu.classList.contains("is-open");
    mobileMenu.classList.toggle("is-open", willOpen);
    mobileLauncher.setAttribute("aria-expanded", String(willOpen));
    if (willOpen) positionMobileMenu();
  }

  function inspectCompactDocsLayer() {
    const open = docsPanel.classList.contains("is-compact-open");
    if (!open) return { status: "closed", open: false };
    const rect = docsPanel.getBoundingClientRect();
    const sampleX = Math.max(rect.left + 1, Math.min(rect.right - 1, rect.left + Math.min(80, rect.width / 2)));
    const sampleY = Math.max(rect.top + 1, Math.min(rect.bottom - 1, rect.top + Math.min(32, rect.height / 2)));
    const hit = document.elementFromPoint(sampleX, sampleY);
    const issues = [];
    if (docsPanel.parentElement !== overlayRoot) issues.push("DOCS_NOT_IN_OVERLAY_ROOT");
    if (!compactBackdrop.classList.contains("is-open")) issues.push("COMPACT_BACKDROP_NOT_OPEN");
    if (!isVisible(docsPanel)) issues.push("COMPACT_DOCS_NOT_VISIBLE");
    if (!(hit && (hit === docsPanel || docsPanel.contains(hit)))) issues.push("COMPACT_DOCS_NOT_CLICKABLE");
    if (!markerLayer.classList.contains("is-hidden")) issues.push("MARKERS_VISIBLE_BEHIND_DOCS");
    return {
      status: issues.length ? "fail" : "pass",
      open: true,
      issues,
      mountedToOverlayRoot: docsPanel.parentElement === overlayRoot,
      markersHidden: markerLayer.classList.contains("is-hidden"),
      hitInsidePanel: Boolean(hit && (hit === docsPanel || docsPanel.contains(hit))),
      rect: serializeRect(rect)
    };
  }

  function auditCompactDocsLayer(logFailure = false) {
    const report = inspectCompactDocsLayer();
    docsPanel.dataset.protoMobileLayerStatus = report.status;
    if (logFailure && report.status === "fail") console.error("移动端中宽原型说明层级检查未通过", report);
    return report;
  }

  function restoreCompactDocsToStage() {
    if (docsPanel.parentElement !== stage) stage.insertBefore(docsPanel, docsSplitter || device);
  }

  function openCompactDocs() {
    if (isMobileViewport() || window.innerWidth >= 1180) return;
    ensureOverlayLayer(false);
    overlayRoot.appendChild(docsPanel);
    compactBackdrop.classList.add("is-open");
    docsPanel.classList.add("is-compact-open");
    renderMarkers();
    requestAnimationFrame(() => auditCompactDocsLayer(true));
  }

  function closeCompactDocs() {
    const wasOpen = docsPanel.classList.contains("is-compact-open");
    docsPanel.classList.remove("is-compact-open");
    compactBackdrop.classList.remove("is-open");
    restoreCompactDocsToStage();
    docsPanel.dataset.protoMobileLayerStatus = "closed";
    if (wasOpen) renderMarkers();
  }

  desktopToggle.addEventListener("click", () => {
    desktopEnabled = !desktopEnabled;
    desktopToggle.setAttribute("aria-checked", String(desktopEnabled));
    desktopToggle.setAttribute("aria-label", desktopEnabled ? "隐藏页面标注" : "显示页面标注");
    renderMarkers();
  });

  compactTrigger.addEventListener("click", openCompactDocs);
  compactClose.addEventListener("click", closeCompactDocs);
  compactBackdrop.addEventListener("click", closeCompactDocs);

  let launcherDrag = null;
  let suppressLauncherClick = false;
  mobileLauncher.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    const rect = mobileLauncher.getBoundingClientRect();
    launcherDrag = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, left: rect.left, top: rect.top, moved: false };
    mobileLauncher.style.left = `${rect.left}px`;
    mobileLauncher.style.top = `${rect.top}px`;
    mobileLauncher.style.right = "auto";
    mobileLauncher.style.bottom = "auto";
    mobileLauncher.setPointerCapture(event.pointerId);
  });
  mobileLauncher.addEventListener("pointermove", event => {
    if (!launcherDrag || event.pointerId !== launcherDrag.pointerId) return;
    const dx = event.clientX - launcherDrag.startX;
    const dy = event.clientY - launcherDrag.startY;
    if (Math.hypot(dx, dy) > 5) launcherDrag.moved = true;
    if (!launcherDrag.moved) return;
    mobileLauncher.style.left = `${Math.max(8, Math.min(window.innerWidth - 60, launcherDrag.left + dx))}px`;
    mobileLauncher.style.top = `${Math.max(8, Math.min(window.innerHeight - 60, launcherDrag.top + dy))}px`;
    closeMobileMenu();
  });
  mobileLauncher.addEventListener("pointerup", event => {
    if (!launcherDrag || event.pointerId !== launcherDrag.pointerId) return;
    suppressLauncherClick = launcherDrag.moved;
    launcherDrag = null;
  });
  mobileLauncher.addEventListener("click", event => {
    if (suppressLauncherClick) {
      suppressLauncherClick = false;
      event.preventDefault();
      return;
    }
    toggleMobileMenu();
  });

  mobileToggle.addEventListener("click", event => {
    event.stopPropagation();
    mobileEnabled = !mobileEnabled;
    mobileToggle.setAttribute("aria-checked", String(mobileEnabled));
    mobileToggle.setAttribute("aria-label", mobileEnabled ? "隐藏页面标注" : "显示页面标注");
    renderMarkers();
  });
  mobileDocsOpen.addEventListener("click", openMobileDocs);
  document.getElementById("protoMobileMobileDocsClose").addEventListener("click", closeMobileDocs);
  document.getElementById("protoMobileMobileNoteClose").addEventListener("click", closeMobileNote);
  document.getElementById("protoMobileMobileNoteMask").addEventListener("click", closeMobileNote);
  document.getElementById("protoMobileMobileSheetSize").addEventListener("click", () => {
    sheetSnap = (sheetSnap + 1) % sheetSnaps.length;
    applySheetSnap();
  });

  let sheetDrag = null;
  mobileSheetHandle.addEventListener("pointerdown", event => {
    sheetDrag = { pointerId: event.pointerId, startY: event.clientY, startHeight: mobileSheet.getBoundingClientRect().height };
    mobileSheetHandle.setPointerCapture(event.pointerId);
  });
  mobileSheetHandle.addEventListener("pointermove", event => {
    if (!sheetDrag || event.pointerId !== sheetDrag.pointerId) return;
    const height = Math.max(window.innerHeight * 0.36, Math.min(window.innerHeight * 0.94, sheetDrag.startHeight + sheetDrag.startY - event.clientY));
    mobileSheet.style.setProperty("--protoMobile-sheet-height", `${height}px`);
  });
  mobileSheetHandle.addEventListener("pointerup", event => {
    if (!sheetDrag || event.pointerId !== sheetDrag.pointerId) return;
    const ratio = mobileSheet.getBoundingClientRect().height / window.innerHeight;
    sheetSnap = sheetSnaps.reduce((best, value, index) => Math.abs(value - ratio) < Math.abs(sheetSnaps[best] - ratio) ? index : best, 0);
    sheetDrag = null;
    applySheetSnap();
  });

  document.addEventListener("click", event => {
    if (!mobileMenu.contains(event.target) && !mobileLauncher.contains(event.target)) closeMobileMenu();
  });
  document.addEventListener("scroll", scheduleMarkerLayout, true);
  document.addEventListener("prototype-annotation:scopechange", () => scheduleContextRefresh(true));
  document.addEventListener("animationstart", () => scheduleContextRefresh(true), true);
  document.addEventListener("animationend", () => scheduleContextRefresh(true), true);
  document.addEventListener("animationcancel", () => scheduleContextRefresh(true), true);
  document.addEventListener("transitionrun", () => scheduleContextRefresh(true), true);
  document.addEventListener("transitionend", () => scheduleContextRefresh(true), true);
  document.addEventListener("transitioncancel", () => scheduleContextRefresh(true), true);
  window.addEventListener("resize", () => {
    closeCompactDocs();
    closeMobileMenu();
    closeMobileNote();
    setDesktopDocsWidth(getDesktopDocsWidth(), false);
    applySheetSnap();
    scheduleContextRefresh(true);
    requestAnimationFrame(() => auditLayout(true));
  });

  const scopeObserver = new MutationObserver(() => scheduleContextRefresh(true));
  scopeObserver.observe(appRoot, {
    subtree: true,
    attributes: true,
    attributeFilter: ["class", "hidden", "style", "aria-hidden", "aria-selected", "data-proto-scope", "data-proto-layer"]
  });
  if (window.ResizeObserver) {
    const resizeObserver = new ResizeObserver(() => scheduleContextRefresh(true));
    resizeObserver.observe(device);
    resizeObserver.observe(appRoot);
    resizeObserver.observe(stage);
  }

  function inspectCurrentScopeAnnotations() {
    const context = getScopeContext();
    const configured = notesForScope(context.scope);
    const invalidTargetIds = [];
    const hiddenTargetIds = [];
    const undersizedTargetIds = [];
    configured.forEach(note => {
      const target = findTarget(note, context.node);
      if (!target) invalidTargetIds.push(note.id);
      else if (!isTargetRenderable(target, context.node)) hiddenTargetIds.push(note.id);
      else if (isTargetUndersized(target)) undersizedTargetIds.push(note.id);
    });
    return {
      scope: context.scope,
      configuredCount: configured.length,
      listCount: currentNotes.length,
      markerNodeCount: markerLayer.querySelectorAll(".protoMobile-marker").length,
      invalidTargetIds,
      hiddenTargetIds,
      undersizedTargetIds,
      currentIds: currentNotes.map(note => note.id)
    };
  }

  window.__prototypeMobileDiagnostics = {
    inspect() {
      const rect = mobileLauncher.getBoundingClientRect();
      const hit = isMobileViewport() ? document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2) : null;
      return {
        viewportMode: isMobileViewport() ? "mobile" : "desktop",
        layerMode: overlayRoot.dataset.protoMobileLayerMode || "unknown",
        scope: getScopeContext().scope,
        annotationCount: currentNotes.length,
        annotationIds: currentNotes.map(note => note.id),
        deviceScrollTop: device.scrollTop,
        stageScrollTop: stage.scrollTop,
        windowScrollY: window.scrollY,
        annotationAudit: inspectCurrentScopeAnnotations(),
        layoutAudit: auditLayout(false),
        compactDocsAudit: inspectCompactDocsLayer(),
        launcherClickable: !isMobileViewport() || Boolean(hit && (hit === mobileLauncher || mobileLauncher.contains(hit)))
      };
    },
    repair() {
      ensureOverlayLayer(true);
      if (docsPanel.classList.contains("is-compact-open")) overlayRoot.appendChild(docsPanel);
      syncContext();
      requestAnimationFrame(() => auditCompactDocsLayer(true));
    }
  };

  restoreDesktopDocsWidth();
  makeDesktopDocsResizable();
  ensureOverlayLayer(false);
  renderGlobalDocs()
    .then(() => {
      syncContext();
      requestAnimationFrame(() => requestAnimationFrame(() => auditLayout(true)));
    })
    .catch(error => {
      console.error("移动端原型说明渲染失败", error);
      syncContext();
    });
  applySheetSnap();
})();

</script>

      'pc_insure_daily_ax.html': { id: 'pc_insure_daily_ax', name: '安心日保PC端', path: 'pc_insure_daily_ax.html', visible: true }
    };

    function cleanFileOrId(raw) {
      if (!raw) return '';
      var str = String(raw).trim();
      if (str.indexOf('#page=') !== -1) {
        return str.split('#page=').pop().split(/[?&#]/)[0].trim();
      }
      return str.split(/[?#]/)[0].split('/').pop().trim();
    }

    function resolvePageTarget(rawInput) {
      var fileOrId = cleanFileOrId(rawInput);
      if (!fileOrId) return null;
      var lower = fileOrId.toLowerCase();
      var noExt = lower.replace(/\.html$/i, '');
      var aliasTarget = DEFAULT_TAB_MAP[lower] || DEFAULT_TAB_MAP[noExt];

      var reg = Array.isArray(window.__PRD_PAGES_REGISTRY__) ? window.__PRD_PAGES_REGISTRY__ : [];
      if (reg.length > 0) {
        var visMatch = reg.find(function(p) {
          if (p.visible === false) return false;
          var pid = String(p.id || '').toLowerCase();
          var ppath = String(p.path || '').toLowerCase();
          return pid === noExt || ppath === lower || ppath.endsWith('/' + lower) ||
                 (aliasTarget && (pid === aliasTarget.id.toLowerCase() || ppath === aliasTarget.path.toLowerCase()));
        });
        if (visMatch) return visMatch;

        var invisMatch = reg.find(function(p) {
          var pid = String(p.id || '').toLowerCase();
          var ppath = String(p.path || '').toLowerCase();
          return pid === noExt || ppath === lower || ppath.endsWith('/' + lower);
        });
        if (invisMatch) return invisMatch;
      }

      if (aliasTarget) return aliasTarget;
      if (lower.endsWith('.html')) {
        return { id: noExt, name: noExt, path: fileOrId, visible: true };
      }
      return null;
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'PRD_PAGES_UPDATED' && Array.isArray(e.data.pages)) {
        window.__PRD_PAGES_REGISTRY__ = e.data.pages;
      }
    });

    function navigateAndSync(targetUrl, evt) {
      var resolved = resolvePageTarget(targetUrl);
      if (!resolved) return false;

      if (window.parent && window.parent !== window) {
        if (resolved.visible === false) {
          if (evt) {
            evt.preventDefault();
            evt.stopPropagation();
            if (evt.stopImmediatePropagation) evt.stopImmediatePropagation();
          }
          try {
            window.parent.postMessage({ type: 'GUARD_BLOCKED', name: resolved.name || resolved.id, file: resolved.path }, '*');
            window.parent.postMessage({ type: 'PRD_PAGE_CHANGED', pageId: resolved.id, path: resolved.path }, '*');
          } catch (err) {}
          return true;
        }

        if (evt) {
          evt.preventDefault();
          evt.stopPropagation();
          if (evt.stopImmediatePropagation) evt.stopImmediatePropagation();
        }
        try {
          sessionStorage.setItem('__PROTOHUB_SYNCED_PAGE__', resolved.id);
          sessionStorage.removeItem('__PROTOHUB_INNER_ACTION_TS__');
        } catch (err) {}
        try {
          window.parent.postMessage({ type: 'PRD_PAGE_CHANGED', pageId: resolved.id, path: resolved.path }, '*');
          window.parent.postMessage({ type: 'SWITCH_PAGE', pageId: resolved.id, path: resolved.path }, '*');
        } catch (err) {}
        return true;
      }

      window.location.href = resolved.path || targetUrl;
      return true;
    }

    window.__protoHubNavigate = function(targetUrl, evt) {
      return navigateAndSync(targetUrl, evt);
    };

    function markInnerInteraction() {
      try {
        sessionStorage.setItem('__PROTOHUB_INNER_ACTION_TS__', String(Date.now()));
      } catch (err) {}
    }
    document.addEventListener('pointerdown', markInnerInteraction, true);
    document.addEventListener('keydown', markInnerInteraction, true);

    document.addEventListener('click', function(e) {
      markInnerInteraction();
      if (!window.parent || window.parent === window) return;

      var link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (link) {
        var href = link.getAttribute('href') || '';
        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('tel:') && !href.startsWith('mailto:')) {
          var cleanHref = cleanFileOrId(href);
          if (cleanHref && cleanHref.toLowerCase().endsWith('.html')) {
            if (navigateAndSync(href, e)) return;
          }
        }
      }

      var clickEl = e.target && e.target.closest ? e.target.closest('[onclick]') : null;
      if (clickEl) {
        var onclickStr = clickEl.getAttribute('onclick') || '';
        var m = onclickStr.match(/(?:window\.)?location(?:\.href)?\s*=\s*['"`]([^'"`]+)['"`]/);
        if (m && m[1]) {
          var targetHref = m[1];
          var cleanTarget = cleanFileOrId(targetHref);
          if (cleanTarget && (cleanTarget.toLowerCase().endsWith('.html') || targetHref.indexOf('#page=') !== -1)) {
            if (navigateAndSync(targetHref, e)) return;
          }
        }
      }
    }, true);

    function syncCurrentPageOnLoad() {
      if (!window.parent || window.parent === window) return;
      try {
        var curFile = (window.location.pathname.split('/').pop() || '').split('?')[0].split('#')[0];
        if (!curFile || curFile === 'about:blank') return;
        var resolved = resolvePageTarget(curFile) || { id: curFile.replace(/\.html$/i, ''), path: curFile, visible: true };

        window.parent.postMessage({
          type: 'PRD_PAGE_CHANGED',
          pageId: resolved.id,
          path: resolved.path || curFile
        }, '*');

        var lastSynced = '';
        var lastActionTs = 0;
        try {
          lastSynced = sessionStorage.getItem('__PROTOHUB_SYNCED_PAGE__') || '';
          lastActionTs = Number(sessionStorage.getItem('__PROTOHUB_INNER_ACTION_TS__') || 0);
          sessionStorage.setItem('__PROTOHUB_SYNCED_PAGE__', resolved.id);
          sessionStorage.removeItem('__PROTOHUB_INNER_ACTION_TS__');
        } catch (err) {}

        if (lastSynced !== resolved.id && lastActionTs > 0 && (Date.now() - lastActionTs < 8000)) {
          window.parent.postMessage({
            type: 'SWITCH_PAGE',
            pageId: resolved.id,
            path: resolved.path || curFile
          }, '*');
        }
      } catch (err) {}
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', syncCurrentPageOnLoad);
    } else {
      setTimeout(syncCurrentPageOnLoad, 0);
    }
    window.addEventListener('pageshow', syncCurrentPageOnLoad);
    window.addEventListener('popstate', syncCurrentPageOnLoad);
  })();
  </script>
</body>
