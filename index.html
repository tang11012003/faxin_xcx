<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发薪管理系统 · 统一产品需求文档 (PRD) 工作台</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: #edf0f6;
  color: #223355;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部极简浅色导航总控栏 */
.top-hub-header {
  height: 48px;
  background: #ffffff;
  border-bottom: 1px solid #dde1eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
}

.hub-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hub-tag {
  background: #1677ff;
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}
.hub-title {
  font-size: 14px;
  font-weight: 700;
  color: #1e293b;
}

/* 页面切换 Tab 胶囊 */
.hub-tabs-container {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  margin: 0 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.hub-tabs-container::-webkit-scrollbar { display: none; }

.hub-tab-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 16px;
  font-size: 12.5px;
  font-weight: 500;
  text-decoration: none;
  background: #f8fafc;
  color: #475569;
  border: 1px solid #cbd5e1;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.12s ease;
}
.hub-tab-chip:hover {
  background: #f1f5f9;
  color: #0f172a;
  border-color: #94a3b8;
}
.hub-tab-chip.is-active {
  background: #1677ff;
  color: #ffffff;
  border-color: #1677ff;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(22, 119, 255, 0.25);
}

.hub-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hub-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #475569;
  cursor: pointer;
  transition: all 0.12s ease;
}
.hub-btn:hover {
  background: #f8fafc;
  border-color: #94a3b8;
  color: #0f172a;
}
.hub-btn.primary {
  background: #eff6ff;
  color: #1d4ed8;
  border-color: #93c5fd;
  font-weight: 600;
}

/* 主体容器：100% 呈现目标页面的三栏审阅器 */
.hub-viewport {
  flex: 1;
  width: 100%;
  height: calc(100vh - 48px);
  position: relative;
  background: #edf0f6;
}
.hub-frame {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  display: block;
}

/* 页面管理弹窗 */
.hub-modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(2px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.hub-modal.show { display: flex; }
.hub-modal-box {
  background: #ffffff;
  border-radius: 12px;
  width: 100%;
  max-width: 540px;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
}
.hub-modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.hub-modal-title {
  font-size: 15px;
  font-weight: 700;
  color: #1e293b;
}
.hub-modal-list {
  max-height: 260px;
  overflow-y: auto;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 6px;
  margin-bottom: 14px;
}
.hub-modal-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  border-bottom: 1px solid #f1f5f9;
  font-size: 13px;
}
.hub-modal-item:last-child { border-bottom: none; }
.hub-input-row {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
}
.hub-input {
  padding: 6px 10px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 12.5px;
  outline: none;
}
.hub-input:focus { border-color: #1677ff; }
</style>

<style id="cleanScrollbarFix">
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
html, body, #app, .page-body {
  -ms-overflow-style: none !important;
  scrollbar-width: none !important;
}
</style>

</head>
<body>

<!-- 顶部工作台总控栏 -->
<header class="top-hub-header">
  <div class="hub-brand">
    <span class="hub-tag">PRD HUB</span>
    <span class="hub-title">发薪管理系统 · 产品文档交互工作台</span>
  </div>

  <!-- 页面切换胶囊 Tab 栏 -->
  <nav class="hub-tabs-container" id="hubTabsBar">
    <!-- 动态插入可切换页面 -->
  </nav>

  <!-- 工具栏 -->
  <div class="hub-tools">
    <button class="hub-btn primary" onclick="openModal()">
      <span class="material-icons" style="font-size:15px">tune</span>
      <span>页面管理(勾选/新增)</span>
    </button>
    <button class="hub-btn" onclick="reloadFrame()" title="刷新当前页面">
      <span class="material-icons" style="font-size:15px">refresh</span>
      <span>刷新</span>
    </button>
  </div>
</header>

<!-- 主视口：直接 100% 渲染目标页面的三栏审阅器 -->
<main class="hub-viewport">
  <iframe class="hub-frame" id="hubFrame" src="about:blank"></iframe>
</main>

<!-- 页面展示管理弹窗 -->
<div class="hub-modal" id="hubModal" onclick="closeModal(event)">
  <div class="hub-modal-box" onclick="event.stopPropagation()">
    <div class="hub-modal-head">
      <strong class="hub-modal-title">页面展示管理 (勾选向开发公开的页面)</strong>
      <button style="border:none;background:none;font-size:18px;cursor:pointer;color:#64748b" onclick="closeModal()">&times;</button>
    </div>

    <div style="font-size:12px;color:#64748b;margin-bottom:10px">
      勾选的页面会显示在顶部导航栏中，点击即可切换体验对应的完整三栏 PRD 原型：
    </div>

    <div class="hub-modal-list" id="modalPageList"></div>

    <div class="hub-input-row">
      <input type="text" class="hub-input" id="newPgName" placeholder="页面名称 (如: 极速发薪)" style="flex:1">
      <input type="text" class="hub-input" id="newPgPath" placeholder="文件路径 (如: shouye.html)" style="flex:1.2">
      <button class="hub-btn primary" type="button" onclick="handleAddPage()">添加</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="hub-btn" onclick="resetDefaults()">恢复默认清单</button>
      <div style="display:flex;gap:8px">
        <button class="hub-btn" onclick="closeModal()">取消</button>
        <button class="hub-btn primary" onclick="savePages()">保存并应用配置</button>
      </div>
    </div>
  </div>
</div>

<script>
// 发薪管理系统专属默认页面清单
const UNIFIED_STORAGE_KEY = 'PRD_PAGES_REGISTRY_BUILD_1792756402085';
const DEFAULT_PAGES = [
  {
    "id": "shouye",
    "name": "首页",
    "path": "shouye.html",
    "filename": "shouye.html",
    "isWrapperHub": false,
    "hasAnnotations": false,
    "visible": true,
    "order": 1
  },
  {
    "id": "project_detail",
    "name": "人员名单",
    "path": "project_detail.html",
    "visible": true,
    "order": 2
  },
  {
    "id": "pay_salary",
    "name": "我要发薪",
    "path": "pay_salary.html",
    "filename": "pay_salary.html",
    "isWrapperHub": false,
    "hasAnnotations": false,
    "visible": true,
    "order": 3
  },
  {
    "id": "contract_create",
    "name": "创建合同",
    "path": "contract_create.html",
    "visible": true,
    "order": 4
  },
  {
    "id": "contract_detail",
    "name": "合同详情",
    "path": "contract_detail.html",
    "visible": true,
    "order": 5
  },
  {
    "id": "insurance_create",
    "name": "创建投保",
    "path": "insurance_create.html",
    "visible": true,
    "order": 6
  },
  {
    "id": "company_project",
    "name": "加保详情",
    "path": "company_project.html",
    "visible": true,
    "order": 7
  },
  {
    "id": "dispatch_unit",
    "name": "申请派遣单位",
    "path": "dispatch_unit.html",
    "visible": true,
    "order": 8
  },
  {
    "id": "contract_list",
    "name": "电子合同",
    "path": "contract_list.html",
    "visible": true,
    "order": 9
  },
  {
    "id": "insurance_list",
    "name": "安心日保",
    "path": "insurance_list.html",
    "visible": true,
    "order": 10
  },
  {
    "id": "pc_insure_daily_ax",
    "name": "安心日保PC端",
    "path": "pc_insure_daily_ax.html",
    "visible": true,
    "order": 11
  }
];

let pageList = [];
try {
  const saved = localStorage.getItem(UNIFIED_STORAGE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    const defaultMap = new Map(DEFAULT_PAGES.map(p => [p.path, p]));
    const validSaved = Array.isArray(parsed) ? parsed.filter(p => defaultMap.has(p.path)) : [];
    if (validSaved.length > 0) {
      DEFAULT_PAGES.forEach(dp => {
        if (!validSaved.some(p => p.path === dp.path)) {
          validSaved.push(JSON.parse(JSON.stringify(dp)));
        }
      });
      pageList = validSaved;
    } else {
      pageList = JSON.parse(JSON.stringify(DEFAULT_PAGES));
    }
  } else {
    pageList = JSON.parse(JSON.stringify(DEFAULT_PAGES));
  }
} catch(e) {
  pageList = JSON.parse(JSON.stringify(DEFAULT_PAGES));
}

let activePageId = DEFAULT_PAGES.length ? DEFAULT_PAGES[0].id : '';
let isSyncingFromIframe = false;

function applyPageSync(filenameOrId) {
  if (!filenameOrId) return;
  const clean = filenameOrId.toLowerCase().split('?')[0].split('#')[0];
  const target = clean.endsWith('.html') ? clean.slice(0, -5) : clean;
  
  const matched = pageList.find(p => 
    p.id.toLowerCase() === target || 
    p.path.toLowerCase().replace('.html', '') === target
  );
  
  if (matched && activePageId !== matched.id) {
    if (!matched.visible) {
      matched.visible = true;
    }
    activePageId = matched.id;
    isSyncingFromIframe = true;
    window.location.hash = `page=${matched.id}`;
    setTimeout(() => { isSyncingFromIframe = false; }, 120);
    renderTabs();
    scrollActiveTabIntoView();
  }
}

function syncFromIframe() {
  const frame = document.getElementById('hubFrame');
  if (!frame) return;
  try {
    const loc = frame.contentWindow.location;
    const pathStr = loc.pathname || loc.href || '';
    const filename = pathStr.split('/').pop().split('?')[0].split('#')[0];
    if (filename && filename !== 'about:blank') {
      applyPageSync(filename);
    }
  } catch (e) {
    // 跨域或安全环境降级，由 message 事件接管
  }
}

function scrollActiveTabIntoView() {
  setTimeout(() => {
    const activeTab = document.querySelector('.hub-tab-chip.is-active');
    if (activeTab) {
      activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }, 50);
}

window.addEventListener('message', (event) => {
  if (event.data && (event.data.type === 'PRD_PAGE_CHANGED' || event.data.type === 'PAGE_NAVIGATE')) {
    applyPageSync(event.data.path || event.data.pageId);
  }
});

function init() {
  const frame = document.getElementById('hubFrame');
  if (frame) {
    frame.addEventListener('load', syncFromIframe);
  }

  const hash = window.location.hash.replace('#page=', '').toLowerCase();
  const matched = pageList.find(p => p.id.toLowerCase() === hash || p.path.toLowerCase().replace('.html', '') === hash);
  if (matched) {
    if (!matched.visible) {
      matched.visible = true;
    }
    switchPage(matched.id);
  } else {
    const firstVis = pageList.find(p => p.visible) || pageList[0];
    if (firstVis) switchPage(firstVis.id);
  }
  renderTabs();
}

function renderTabs() {
  const bar = document.getElementById('hubTabsBar');
  if (!bar) return;
  bar.innerHTML = '';

  pageList.filter(p => p.visible).forEach(p => {
    const chip = document.createElement('button');
    chip.className = `hub-tab-chip ${p.id === activePageId ? 'is-active' : ''}`;
    chip.textContent = p.name;
    chip.onclick = () => switchPage(p.id);
    bar.appendChild(chip);
  });
}

function switchPage(pageId) {
  const pg = pageList.find(p => p.id === pageId);
  if (!pg) return;

  activePageId = pg.id;
  window.location.hash = `page=${pg.id}`;

  renderTabs();
  scrollActiveTabIntoView();

  const frame = document.getElementById('hubFrame');
  if (frame && !frame.src.endsWith(pg.path)) {
    frame.src = pg.path;
  }
}

function reloadFrame() {
  const frame = document.getElementById('hubFrame');
  if (frame) {
    frame.src = frame.src;
  }
}

// 模态框管理
function openModal() {
  renderModalList();
  document.getElementById('hubModal').classList.add('show');
}
function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('hubModal').classList.remove('show');
}

function renderModalList() {
  const container = document.getElementById('modalPageList');
  if (!container) return;
  container.innerHTML = '';
  pageList.forEach((p, idx) => {
    const row = document.createElement('div');
    row.className = 'hub-modal-item';
    row.innerHTML = `
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" ${p.visible ? 'checked' : ''} onchange="pageList[${idx}].visible = this.checked" />
        <span style="font-weight:600;color:#1e293b">${p.name}</span>
        <span style="color:#94a3b8;font-size:11px">(${p.path})</span>
      </label>
      <button style="border:none;background:none;color:#ef4444;cursor:pointer;font-size:14px" onclick="deletePage(${idx})">&times;</button>
    `;
    container.appendChild(row);
  });
}

function handleAddPage() {
  const name = document.getElementById('newPgName').value.trim();
  const path = document.getElementById('newPgPath').value.trim();
  if (name && path) {
    const id = path.replace('.html', '').replace(/[^a-zA-Z0-9_-]/g, '_');
    pageList.push({ id, name, path, visible: true });
    document.getElementById('newPgName').value = '';
    document.getElementById('newPgPath').value = '';
    renderModalList();
  }
}

function deletePage(idx) {
  pageList.splice(idx, 1);
  renderModalList();
}

function savePages() {
  try {
    localStorage.setItem(UNIFIED_STORAGE_KEY, JSON.stringify(pageList));
  } catch(e){}
  renderTabs();
  closeModal();
}

function resetDefaults() {
  pageList = JSON.parse(JSON.stringify(DEFAULT_PAGES));
  renderModalList();
}

window.addEventListener('DOMContentLoaded', init);
window.addEventListener('hashchange', () => {
  if (isSyncingFromIframe) {
    return;
  }
  const hash = window.location.hash.replace('#page=', '').toLowerCase();
  const matched = pageList.find(p => p.id.toLowerCase() === hash || p.path.toLowerCase().replace('.html', '') === hash);
  if (matched) {
    if (!matched.visible) matched.visible = true;
    switchPage(matched.id);
  }
});
</script>
</body>
</html>
